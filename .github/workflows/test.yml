name: regression
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m zend_decompiler --version
      - run: python -m zend_decompiler validate
      # PHP 5.2 compiler and Zend-probe infrastructure are NOT on this runner.
      # Original encoded PHP and generated candidates MUST NOT be executed in CI.
