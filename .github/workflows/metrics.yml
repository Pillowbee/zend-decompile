name: Decompiler regression and candidate metrics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install jsonschema
      - name: Count passed unit tests (skips are not successes)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = result.testsRun - len(result.skipped) - len(result.failures) - len(result.errors) - len(result.expectedFailures) - len(result.unexpectedSuccesses)
          print(f'PASSED_TESTS={passed} RUN={result.testsRun} SKIPPED={len(result.skipped)}')
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Restore all unchanged sample inputs
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m zend_decompiler batch sample_inputs -o "$RUNNER_TEMP/zend_batch" --isolate-parser
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python - "$RUNNER_TEMP/zend_batch/batch_report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['total'] == 11, 'Unexpected sample corpus size'
          assert sum(r[k] for k in ('generated','unsupported','not_encoded')) == r['total']
          assert all(row['status'] == 'candidate_generated' and 'output' in row for row in r['files'] if row['status'] == 'candidate_generated')
          print(f"FULL_CANDIDATES={r['generated']} UNSUPPORTED={r['unsupported']} NOT_ENCODED={r['not_encoded']}")
          PY
      - name: Diagnose unsupported function groups without running PHP
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from zend_decompiler.assets import DICTIONARY, OPCODE_MAP
          from zend_decompiler.research import research
          for filename in ('links_fun(1).php', 'fun_all.php'):
              with tempfile.TemporaryDirectory() as temporary:
                  report = research(Path('sample_inputs') / filename, DICTIONARY, OPCODE_MAP, Path(temporary))
              print(f"GROUP_PROGRESS {filename} {report['complete_groups']}/{len(report['groups'])}")
              for group in report['groups']:
                  if not group['generated']:
                      print(f"UNSUPPORTED_GROUP {filename} {group['name']}: {group.get('failure', '?')[:250]}")
          PY
      - name: Inspect opaque call operand layout without printing literals
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zend_decompiler.assets import DICTIONARY, OPCODE_MAP
          from zend_decompiler.serial_parser import decompress_encoded, parse_binary
          from zend_decompiler.calibrate import choose_opcode
          mapping=json.loads(OPCODE_MAP.read_text())
          targets={'links_fun(1).php':{'<main>':12,'count_ln_out':1},
                   'fun_all.php':{'path_groups':25,'out_replace_files':31,'minmax_price':43}}
          def shape(n):
              return {'kind':n['type'], 'words':[n.get('word0'),n.get('word1')] if n['type']!=1 else None,
                      'constant_kind': n.get('constant',{}).get('kind') if n['type']==1 else None}
          for filename,locations in targets.items():
              parsed=parse_binary(decompress_encoded(Path('sample_inputs')/filename,DICTIONARY.read_bytes())[0][1])
              groups={'<main>':parsed['main']}
              groups.update({bytes.fromhex(g['name_hex']).decode('ascii'):g for g in parsed['functions']})
              for name,center in locations.items():
                  ops=groups[name]['opcodes']
                  for op in ops[max(0,center-3):min(len(ops),center+5)]:
                      num=choose_opcode(op,mapping)
                      print('CALL_CONTEXT',filename,name,op['index'],mapping['names'].get(str(num),f'OP_{num}'),
                            'key',f"{op['index']%8}:{op['encoded_opcode']}",
                            'op1',shape(op['op1']),'op2',shape(op['op2']),
                            'result',shape(op['result']),'extended',op['extended_value'])
          PY
